<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>MediCore - Administración</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Menú Lateral -->
        <aside class="sidebar">
            <div>
                <div class="brand" style="display: flex; align-items: center; gap: 8px;">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="var(--accent)" xmlns="http://www.w3.org/2000/svg">
                        <path d="M19 3H5C3.89 3 3 3.89 3 5V19C3 20.11 3.89 21 5 21H19C20.11 21 21 20.11 21 19V5C21 3.89 20.11 3 19 3ZM17 13H13V17H11V13H7V11H11V7H13V11H17V13Z" />
                    </svg>
                    MediCore
                </div>
                <nav>
                    <button id="nav-usuarios" class="active" onclick="switchTab('usuarios')">Usuarios</button>
                    <button id="nav-reportes" onclick="switchTab('reportes')">Reportes</button>
                </nav>
            </div>

            <div>
                <button onclick="cerrarSesion()" style="width: 100%; background: transparent; border: none; color: #f87171; padding: 12px 16px; text-align: left; font-size: 15px; border-radius: 8px; cursor: pointer; transition: background 0.2s ease;">
                    Cerrar sesión
                </button>
            </div>
        </aside>

        <!-- Área Principal -->
        <main class="main-content">
            <div class="header-user">
                <span id="nombre-admin-header">Cargando... · Administradora</span>
            </div>

            <section id="tab-usuarios">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
                    <h2>Usuarios y roles</h2>
                    <button class="btn btn-primary" onclick="toggleFormulario()">Nuevo usuario</button>
                </div>

                <!-- Formulario Dinámico (Crear / Editar) -->
                <div id="panel-nuevo-usuario" class="card" style="display: none; border-left: 4px solid var(--accent); margin-bottom: 24px;">
                    <h3 id="titulo-form" style="margin-bottom: 16px;">Registrar personal</h3>
                    <form id="form-usuario" onsubmit="guardarUsuario(event)">
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                            <div class="form-group">
                                <label>Nombre completo</label>
                                <input type="text" id="nombre" class="form-control" placeholder="Ej. Carlos Mendoza" required>
                            </div>
                            <div class="form-group">
                                <label>Correo electrónico</label>
                                <input type="email" id="correo" class="form-control" placeholder="c.mendoza@medicore.mx" required>
                            </div>
                            <div class="form-group" id="campo-password">
                                <label>Contraseña temporal</label>
                                <input type="password" id="password" class="form-control" placeholder="••••••••">
                            </div>
                            <div class="form-group">
                                <label>Rol del sistema</label>
                                <select id="rol" class="form-control" required>
                                    <option value="">-- Seleccionar rol --</option>
                                    <option value="Médico">Médico</option>
                                    <option value="Farmacia">Farmacia</option>
                                    <option value="Facturación">Facturación</option>
                                    <option value="Recepción">Recepción</option>
                                    <option value="Administrador">Administrador</option>
                                </select>
                            </div>
                        </div>
                        <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 16px;">
                            <button type="button" class="btn btn-secondary" onclick="toggleFormulario()">Cancelar</button>
                            <button type="submit" class="btn btn-primary">Guardar usuario</button>
                        </div>
                    </form>
                </div>

                <!-- Tabla de Usuarios -->
                <div class="card">
                    <table class="table-custom">
                        <thead>
                            <tr>
                                <th>Nombre</th>
                                <th>Rol</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-usuarios-body">
                            <!-- Datos dinámicos -->
                        </tbody>
                    </table>
                </div>
            </section>

            <section id="tab-reportes" style="display: none;">
                <h2>Reportes financieros y operativos</h2>
                <br>
                <div class="card">
                    <p style="color: var(--text-muted);">Módulo de métricas en construcción...</p>
                </div>
            </section>
        </main>
    </div>

    <script src="js/admin.js"></script>
</body>
</html>

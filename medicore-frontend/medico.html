<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>MediCore - Panel Médico</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Menú Lateral Navigacional -->
        <aside class="sidebar">
            <div class="brand">MediCore</div>
            <nav>
                <button id="nav-consulta" class="active" onclick="switchTab('consulta')">Consulta</button>
                <button id="nav-receta" onclick="switchTab('receta')">Receta</button>
                <button id="nav-historial" onclick="switchTab('historial')">Historial</button>
            </nav>
        </aside>

        <!-- Área de Trabajo -->
        <main class="main-content">
            <div class="header-user">
                <span>Dra. Elena Pérez · Médico &nbsp;</span>
                <span class="user-pill" id="paciente-actual">Paciente: Ana Torres Núñez</span>
            </div>

            <!-- TAB 1: REGISTRO DE CONSULTA (HU6) -->
            <section id="tab-consulta">
                <h2>Consulta médica</h2>
                <br>
                <form id="form-consulta" onsubmit="guardarConsulta(event)">
                    <div class="card">
                        <h3>Signos vitales</h3>
                        <br>
                        <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px;">
                            <div class="form-group">
                                <label>Temp. (°C)</label>
                                <input type="number" step="0.1" id="temp" class="form-control" placeholder="36.8" required>
                            </div>
                            <div class="form-group">
                                <label>Presión</label>
                                <input type="text" id="presion" class="form-control" placeholder="120/80" required>
                            </div>
                            <div class="form-group">
                                <label>Peso (kg)</label>
                                <input type="number" step="0.1" id="peso" class="form-control" placeholder="62" required>
                            </div>
                            <div class="form-group">
                                <label>Pulso</label>
                                <input type="number" id="pulso" class="form-control" placeholder="76" required>
                            </div>
                        </div>
                    </div>

                    <div class="card">
                        <div class="form-group">
                            <label>Diagnóstico *</label>
                            <input type="text" id="diagnostico" class="form-control" placeholder="Ej. Rinitis alérgica" required>
                        </div>
                        <div class="form-group">
                            <label>Tratamiento</label>
                            <textarea id="tratamiento" class="form-control" rows="3" placeholder="Ej. Antihistamínico por 5 días"></textarea>
                        </div>
                        <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 16px;">
                            <button type="submit" class="btn btn-secondary">Guardar consulta</button>
                            <button type="button" class="btn btn-primary" onclick="switchTab('receta')">Emitir receta</button>
                        </div>
                    </div>
                </form>
            </section>

            <!-- TAB 2: RECETA ELECTRÓNICA (HU7) -->
            <section id="tab-receta" style="display: none;">
                <h2>Receta electrónica</h2>
                <br>
                <div class="card">
                    <div class="form-group">
                        <label>Medicamento del catálogo</label>
                        <select id="select-medicamento" class="form-control" onchange="agregarMedicamentoFila()">
                            <option value="">-- Seleccionar medicamento --</option>
                            <option value="1">Paracetamol 500 mg</option>
                            <option value="2">Loratadina 10 mg</option>
                            <option value="3">Amoxicilina 500 mg</option>
                        </select>
                    </div>

                    <table class="table-custom">
                        <thead>
                            <tr>
                                <th>Medicamento</th>
                                <th>Dosis</th>
                                <th>Días</th>
                                <th>Acción</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-receta-body">
                            <!-- Filas dinámicas agregadas por JS -->
                        </tbody>
                    </table>

                    <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 24px;">
                        <button class="btn btn-secondary" onclick="switchTab('consulta')">Cancelar</button>
                        <button class="btn btn-primary" onclick="emitirRecetaFinal()">Emitir receta</button>
                    </div>
                </div>
            </section>

            <!-- TAB 3: HISTORIAL CLÍNICO (HU12) -->
            <section id="tab-historial" style="display: none;">
                <h2>Historial clínico</h2>
                <br>
                <div id="historial-container">
                    <!-- Tarjetas de historial dinámicas -->
                </div>
            </section>
        </main>
    </div>

    <script src="js/medico.js"></script>
</body>
</html>
